<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract-Driven Human/AI Development</title>
<style>
  :root{
    --bg: #0b0f14;
    --bg-raised: #10161d;
    --bg-panel: #0d1117;
    --border: #21262d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --text-bright: #f0f3f6;
    --green: #7ee787;
    --amber: #ffa657;
    --blue: #79c0ff;
    --red: #ff7b72;
    --purple: #d2a8ff;
    --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 8%, rgba(126,231,135,0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(121,192,255,0.05), transparent 40%);
  }

  #deck{
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .slide{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6vh 9vw 9vh 9vw;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
  }
  .slide.active{
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  .slide.exit-left{
    transform: translateX(-40px);
  }

  .kicker{
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 0.6rem;
  }
  .kicker.amber{ color: var(--amber); }
  .kicker.blue{ color: var(--blue); }

  h1{
    font-size: 3rem;
    line-height: 1.15;
    margin: 0 0 0.4rem 0;
    color: var(--text-bright);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  h2{
    font-size: 2.1rem;
    line-height: 1.2;
    margin: 0 0 1.1rem 0;
    color: var(--text-bright);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .subtitle{
    font-size: 1.3rem;
    color: var(--text-dim);
    margin-bottom: 2rem;
    max-width: 46ch;
  }
  p.lede{
    font-size: 1.25rem;
    color: var(--text-dim);
    max-width: 62ch;
    line-height: 1.6;
  }

  .cols{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: start;
  }
  .cols.narrow-right{ grid-template-columns: 1.2fr 1fr; }

  ul.pt, ol.pt{
    font-size: 1.15rem;
    line-height: 1.65;
    color: var(--text);
    padding-left: 1.3rem;
    margin: 0;
  }
  ul.pt li, ol.pt li{ margin-bottom: 0.75rem; }
  ul.pt li::marker{ color: var(--green); }
  ul.pt.tight li, ol.pt.tight li{ margin-bottom: 0.4rem; }

  .tag{
    display:inline-block;
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 0.1rem 0.5rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    margin-right: 0.4rem;
  }

  /* terminal / code window */
  .term{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap: 0.5rem;
    padding: 0.55rem 0.8rem;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
  }
  .term-dot{ width:10px; height:10px; border-radius:50%; }
  .term-dot.r{ background:#ff5f56; }
  .term-dot.y{ background:#ffbd2e; }
  .term-dot.g{ background:#27c93f; }
  .term-path{
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-left: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .term-body{
    padding: 1rem 1.2rem;
    font-family: var(--mono);
    font-size: 0.92rem;
    line-height: 1.55;
    white-space: pre-wrap;
    color: var(--text);
    max-height: 52vh;
    overflow: auto;
  }
  .term-body .c{ color: var(--text-dim); font-style: italic; }
  .term-body .k{ color: var(--purple); }
  .term-body .s{ color: var(--green); }
  .term-body .n{ color: var(--amber); }
  .term-body .h{ color: var(--blue); }
  .term-body .bad{ color: var(--red); }
  .term-body .good{ color: var(--green); }

  .shot{
    margin: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    background: var(--bg-panel);
  }
  .shot img{
    display: block;
    width: 100%;
    height: auto;
  }
  .shot figcaption{
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text-dim);
    padding: 0.5rem 0.8rem;
    border-top: 1px solid var(--border);
  }

  table.map{
    width: 100%;
    border-collapse: collapse;
    font-size: 1.05rem;
  }
  table.map th, table.map td{
    text-align: left;
    padding: 0.7rem 0.9rem;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.map th{
    font-family: var(--mono);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  table.map td.dbc{ font-family: var(--mono); color: var(--blue); white-space: nowrap; }
  table.map td.proc{ color: var(--text); }

  .flow{
    font-family: var(--mono);
    font-size: 1.05rem;
    color: var(--text);
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    gap: 0.5rem 0.3rem;
  }
  .flow .state{
    border: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 0.5rem 0.9rem;
    border-radius: 6px;
  }
  .flow .state.human{ border-color: var(--green); color: var(--green); }
  .flow .state.agent{ border-color: var(--blue); color: var(--blue); }
  .flow .arrow{ color: var(--text-dim); }
  .flow .label{ font-size: 0.72rem; color: var(--text-dim); display:block; text-align:center; }

  .statgrid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-top: 1rem;
  }
  .stat{
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 8px;
    padding: 1.1rem 1rem;
    text-align:center;
  }
  .stat .num{
    font-family: var(--mono);
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--green);
    display:block;
  }
  .stat .lbl{
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 0.3rem;
  }

  .footer-note{
    position:absolute;
    bottom: 3vh;
    left: 9vw;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .footer-note a{ color: var(--blue); text-decoration: none; }
  .footer-note a:hover{ text-decoration: underline; }

  .badge-row{ display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap: wrap; }
  .badge{
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .badge.ok{ border-color: var(--green); color: var(--green); }
  .badge.warn{ border-color: var(--amber); color: var(--amber); }

  blockquote.q{
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--text-bright);
    border-left: 3px solid var(--green);
    margin: 0;
    padding: 0.2rem 0 0.2rem 1.2rem;
    line-height: 1.6;
  }

  .center-slide{
    justify-content:center;
    align-items:center;
    text-align:center;
  }
  .center-slide .subtitle{ max-width: 60ch; margin-left:auto; margin-right:auto; }

  .steps{
    font-family: var(--mono);
    font-size: 1.05rem;
    line-height: 2;
    color: var(--text);
  }
  .steps .n{
    display:inline-block;
    width: 1.6em;
    color: var(--bg);
    background: var(--green);
    border-radius: 4px;
    text-align:center;
    margin-right: 0.6em;
    font-weight: 700;
  }

  /* pipeline diagram: line-icon style stations along a rail */
  .pipeline{
    position: relative;
    display:flex;
    align-items:flex-start;
    gap: 0;
    padding: 0.4rem 0.5rem 1.6rem;
  }
  .pipeline .rail{
    position:absolute;
    left: 3%; right:3%;
    top: 4.7rem;
    height: 2px;
    background: var(--border);
  }
  .pipeline .station{
    position:relative;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .pipeline .station .num{
    font-family: var(--mono);
    font-size:0.68rem;
    color: var(--text-dim);
    margin-bottom:0.25rem;
  }
  .pipeline .station .name{
    font-family: var(--mono);
    font-size:0.62rem;
    color: var(--text-dim);
    line-height:1.25;
    min-height: 2.3em;
    margin-bottom:0.5rem;
    padding: 0 0.15rem;
  }
  .pipeline .box{
    width: 3.1rem; height:3.1rem;
    border-radius:8px;
    border:1px solid var(--border);
    background: var(--bg-panel);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    z-index:1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .pipeline .box svg{ width:1.6rem; height:1.6rem; overflow:visible; }
  .pipeline .box.dyn{ animation: stationBorder 8s infinite; }
  .pipeline .worker{
    position:relative;
    font-family: var(--mono);
    font-size:0.6rem;
    margin-top:0.5rem;
    color: var(--text-dim);
    min-height: 1.4em;
  }
  .pipeline .cycle-layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    animation: stationCycle 8s infinite;
  }
  .pipeline .cycle-layer:nth-of-type(1){ animation-delay: 0s; }
  .pipeline .cycle-layer:nth-of-type(2){ animation-delay: 2s; }
  .pipeline .cycle-layer:nth-of-type(3){ animation-delay: 4s; }
  .pipeline .cycle-layer:nth-of-type(4){ animation-delay: 6s; }
  .pipeline .worker .cycle-layer{ white-space:nowrap; }

  @keyframes stationCycle{
    0%{ opacity:0; }
    4%{ opacity:1; }
    21%{ opacity:1; }
    25%{ opacity:0; }
    100%{ opacity:0; }
  }
  @keyframes stationBorder{
    0%, 48%{ border-color: var(--blue); }
    52%, 98%{ border-color: var(--green); }
    100%{ border-color: var(--blue); }
  }

  /* conveyor variant: one row, a traveling work-item token instead of per-station cycling */
  .pipeline .endcap{
    position:absolute;
    top: 4.7rem;
    transform: translateY(-50%);
    width: 0.85rem; height:0.85rem;
    border-radius:3px;
    z-index:1;
  }
  .pipeline .endcap.in{ left: 3%; margin-left: -1.15rem; background:var(--blue); }
  .pipeline .endcap.out{ right: 3%; margin-right: -1.15rem; background:var(--green); }
  .pipeline .token{
    position:absolute;
    top: 4.7rem;
    width: 0.7rem; height:0.7rem;
    border-radius:3px;
    background: var(--amber);
    transform: translate(-50%, -50%);
    z-index:0;
    animation-name: travelToken;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes travelToken{
    0%{ left:3%; opacity:0; }
    3%{ opacity:1; }
    88%{ left:97%; opacity:1; }
    94%{ opacity:0; }
    100%{ left:97%; opacity:0; }
  }
  .pipeline .box.wide{ width:4.5rem; }
  .pipeline .box .pair{ display:flex; align-items:center; gap:0.2rem; }
  .pipeline .box .pair svg{ width:1.25rem; height:1.25rem; }
  .pipeline .box .plus{ font-family: var(--mono); font-size:0.8rem; color: var(--text-dim); }
  .pipeline-caption{
    text-align:center;
    color: var(--blue);
    font-weight:600;
    font-size:1.05rem;
    margin-top:1.6rem;
  }

  /* UI chrome */
  #progress{
    position: fixed;
    bottom: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--green), var(--blue));
    transition: width 0.3s ease;
    z-index: 20;
  }
  #counter{
    position: fixed;
    bottom: 1.4vh; right: 2vw;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-dim);
    z-index: 20;
  }
  #hint{
    position: fixed;
    top: 1.6vh; right: 2vw;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-dim);
    opacity: 0.7;
    z-index: 20;
  }
  .nav-zone{
    position: fixed; top:0; bottom:0; width: 12%;
    z-index: 10; cursor: pointer;
  }
  .nav-zone.left{ left:0; }
  .nav-zone.right{ right:0; }

  #help-overlay{
    position: fixed; inset:0;
    background: rgba(2,4,7,0.92);
    display:none;
    align-items:center; justify-content:center;
    z-index: 100;
    font-family: var(--mono);
  }
  #help-overlay.show{ display:flex; }
  #help-overlay .box{
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 10px;
    padding: 2rem 2.5rem;
    color: var(--text);
  }
  #help-overlay h3{ color: var(--text-bright); margin-top:0; }
  #help-overlay .row{ display:flex; justify-content:space-between; gap:2rem; padding: 0.3rem 0; color: var(--text-dim); }
  #help-overlay .row kbd{
    background: var(--bg-raised); border:1px solid var(--border);
    border-radius: 4px; padding: 0.1rem 0.45rem; color: var(--text-bright);
  }

  @media (max-width: 900px){
    .cols, .cols.narrow-right{ grid-template-columns: 1fr; }
    h1{ font-size: 2.2rem; }
    h2{ font-size: 1.6rem; }
    .statgrid{ grid-template-columns: repeat(2,1fr); }
  }

  /* phones */
  @media (max-width: 600px){
    .slide{
      padding: 7vh 6vw 9vh 6vw;
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .kicker{ font-size: 0.72rem; }
    h1{ font-size: 1.7rem; }
    h2{ font-size: 1.3rem; }
    .subtitle{ font-size: 1rem; max-width: 100%; }
    p.lede{ font-size: 0.95rem; max-width: 100%; }
    ul.pt, ol.pt{ font-size: 0.92rem; line-height: 1.5; }
    .cols{ gap: 1.2rem; }
    .term-body{ font-size: 0.72rem; padding: 0.7rem 0.8rem; max-height: 40vh; }
    .term-path{ font-size: 0.65rem; }
    table.map{ font-size: 0.8rem; }
    table.map th, table.map td{ padding: 0.45rem 0.5rem; }
    .statgrid{ grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
    .stat{ padding: 0.7rem 0.5rem; }
    .stat .num{ font-size: 1.4rem; }
    .flow{ font-size: 0.85rem; gap: 0.3rem 0.2rem; }
    .steps{ font-size: 0.92rem; }
    .pipeline{ overflow-x: auto; padding-bottom: 1.6rem; }
    .pipeline .station{ min-width: 4.6rem; }
    .pipeline .station:has(.box.wide){ min-width: 5.6rem; }
    .pipeline .rail{ left: 0; right: 0; }
    .pipeline .endcap.in{ left:0; margin-left:-0.3rem; }
    .pipeline .endcap.out{ right:0; margin-right:-0.3rem; }
    .pipeline-caption{ font-size: 0.9rem; }
    .footer-note{ position: static; margin-top: 1.2rem; font-size: 0.68rem; }
    #hint{ display: none; }
    #counter{ font-size: 0.68rem; }
  }
</style>
</head>
<body>

<div id="deck"></div>
<div id="progress" style="width:0%"></div>
<div id="counter">1 / 1</div>
<div id="hint">press ? for keys</div>
<div class="nav-zone left" onclick="prevSlide()"></div>
<div class="nav-zone right" onclick="nextSlide()"></div>

<div id="help-overlay">
  <div class="box">
    <h3>Keyboard shortcuts</h3>
    <div class="row"><span>Next slide</span><span><kbd>&rarr;</kbd> <kbd>Space</kbd> <kbd>PgDn</kbd></span></div>
    <div class="row"><span>Previous slide</span><span><kbd>&larr;</kbd> <kbd>PgUp</kbd></span></div>
    <div class="row"><span>First / last slide</span><span><kbd>Home</kbd> <kbd>End</kbd></span></div>
    <div class="row"><span>Jump to slide</span><span><kbd>1</kbd>&ndash;<kbd>9</kbd></span></div>
    <div class="row"><span>Fullscreen</span><span><kbd>F</kbd></span></div>
    <div class="row"><span>This help</span><span><kbd>?</kbd> / <kbd>Esc</kbd></span></div>
    <div class="row"><span>Previous slide</span><span> left mouse</kbd> on the left side </span></div>
    <div class="row"><span>Next slide</span><span> left mouse</kbd> on the right side </span></div>
  </div>
</div>

<script>
/* ---------- slide content ---------- */
/* Each entry is the innerHTML of one <section class="slide"> */
const slides = [];

// 1. Title
slides.push(`
<div class="center-slide" style="display:flex;flex-direction:column;height:100%;">
  <div class="kicker">a talk for people who ship code, not just prompts</div>
  <h1>Contract-Driven<br>Human/AI Development</h1>
  <p class="subtitle">Applying ideas from Bertrand Meyer's Design by Contract to the obligations
  between humans and the AI agents writing their code.</p>
  <div class="badge-row" style="justify-content:center;">
    <span class="badge ok">preconditions</span>
    <span class="badge ok">postconditions</span>
    <span class="badge ok">invariants</span>
    <span class="badge warn">applied to a dev process, not a function signature</span>
  </div>
  <div class="footer-note" style="position:static; margin-top:2rem; text-align:center;">Inspired by Design by Contract, originated by
<a href="https://bertrandmeyer.com/category/design-by-contract/" target="_blank" rel="noopener">Bertrand Meyer</a> &mdash; an adaptation of its discipline, not its programming-language mechanism.</div>
</div>
`);

// 2. The actual shift
slides.push(`
<div class="kicker amber">the actual shift</div>
<h2>Building got cheap. Deciding what to build didn't.</h2>
<div class="cols">
  <ul class="pt">
    <li>For decades, careful up-front thinking was the discipline you rationed &mdash; building and rebuilding was slow, so teams often skipped straight to code and fixed the design later, if ever.</li>
    <li>AI collapses the cost of execution: writing, testing, and rewriting code is now fast and, more importantly, <strong>disposable</strong>.</li>
    <li>What doesn't get cheaper: deciding what "correct" means for this change, and who's accountable if it isn't.</li>
    <li>That's the discipline this whole system is actually about. Everything downstream of it is just fast execution of a decision already made carefully.</li>
  </ul>
  <div class="term">
    <div class="term-bar"><span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
      <span class="term-path">cost of doing business</span></div>
    <div class="term-body"><span class="h">Before</span>
  thinking   cheap to skip
  building   <span class="bad">expensive to redo</span>

<span class="h">After (AI-assisted)</span>
  thinking   <span class="n">the hard part now</span>
  building   <span class="good">cheap to redo</span></div>
  </div>
</div>
`);

// 2b. The loop
slides.push(`
<div class="kicker blue">the loop this system runs</div>
<h2>Think once. Execute fast. Repeat.</h2>
<p class="lede" style="margin-bottom:1.8rem;">Once intent is written down precisely as a contract, execution stops being precious &mdash;
it doesn't matter whether the implementer is one AI model, a different one next week, or a person.
When requirements change, you don't patch the old assumptions: you write a new contract and let execution catch up, at AI speed.</p>
<div class="flow">
  <span class="state human">contract</span>
  <span class="arrow">&mdash;<span class="label">fast, disposable execution</span>&rarr;</span>
  <span class="state agent">working software</span>
  <span class="arrow">&mdash;<span class="label">accept or reject</span>&rarr;</span>
  <span class="state human">next contract</span>
</div>
<p class="lede" style="margin-top:1.6rem; font-size:1.05rem;">Rinse and repeat &mdash; the pipeline in the next few slides is what one pass through that loop looks like up close. The pipeline isn't the point. The loop is.</p>
`);

// 3. Intro panel 1 - Backlog
slides.push(`
<div class="kicker">the backlog</div>
<h2>Every project starts as a grid of unstarted work</h2>
<div class="cols">
  <ul class="pt">
    <li>A backlog is just squares waiting to be picked up &mdash; nothing here yet says who does the work, or how.</li>
    <li>Every row, every column: a unit of work, not started.</li>
    <li>The next five panels are about how that grid gets filled in.</li>
  </ul>
  <figure class="shot">
    <img src="images/panel-1-backlog.svg" alt="A 9x9 grid representing a software project backlog, all cells white/not-started.">
    <figcaption>1. Software Project Backlog (To Be Built)</figcaption>
  </figure>
</div>

// 10. Origin of DbC
slides.push(`
<div class="kicker">origin</div>
<h2>Design by Contract (Meyer, Eiffel, 1980s)</h2>
<div class="cols">
  <div>
    <p class="lede">A routine and its caller share a contract, exactly like a legal one:</p>
    <ul class="pt">
      <li><strong>Precondition</strong> &mdash; what the caller must guarantee before calling.</li>
      <li><strong>Postcondition</strong> &mdash; what the routine guarantees in return, if the precondition held.</li>
      <li><strong>Invariant</strong> &mdash; a consistency property every operation must restore at externally observable boundaries.</li>
    </ul>
    <p class="lede" style="margin-top:1rem;">Break the contract, and it's clear <em>whose</em> bug it is.</p>
  </div>
  <div class="term">
    <div class="term-bar"><span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
      <span class="term-path">account.e &mdash; Eiffel</span></div>
    <div class="term-body"><span class="k">withdraw</span> (sum: <span class="h">INTEGER</span>)
  <span class="k">require</span>
    <span class="s">sum_positive:</span> sum &gt; <span class="n">0</span>
    <span class="s">sufficient_funds:</span> sum &lt;= balance
  <span class="k">do</span>
    balance := balance - sum
  <span class="k">ensure</span>
    <span class="s">balance_reduced:</span> balance = <span class="k">old</span> balance - sum
  <span class="k">end</span></div>
  </div>
</div>
<p class="footer-note">Meyer, <em>Object-Oriented Software Construction</em>, Prentice Hall, 1988 / 1997 &nbsp;&mdash;&nbsp;
<a href="https://bertrandmeyer.com/category/design-by-contract/" target="_blank" rel="noopener">bertrandmeyer.com/category/design-by-contract</a></p>
`);

/* ---------- engine ---------- */
const deck = document.getElementById("deck");
const progress = document.getElementById("progress");
const counter = document.getElementById("counter");
const helpOverlay = document.getElementById("help-overlay");

slides.forEach((html, i) => {
  const sec = document.createElement("section");
  sec.className = "slide";
  sec.dataset.index = i;
  sec.innerHTML = html;
  deck.appendChild(sec);
});

const sections = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function render(){
  sections.forEach((s, i) => {
    s.classList.remove("active", "exit-left");
    if(i === current) s.classList.add("active");
    else if(i < current) s.classList.add("exit-left");
  });
  progress.style.width = ((current + 1) / sections.length * 100) + "%";
  counter.textContent = (current + 1) + " / " + sections.length;
  history.replaceState(null, "", "#" + (current + 1));
}

function goTo(i){
  if(i < 0 || i >= sections.length) return;
  current = i;
  render();
}
function nextSlide(){ goTo(current + 1); }
function prevSlide(){ goTo(current - 1); }

function toggleHelp(force){
  const show = force !== undefined ? force : !helpOverlay.classList.contains("show");
  helpOverlay.classList.toggle("show", show);
}

document.addEventListener("keydown", (e) => {
  if(helpOverlay.classList.contains("show") && e.key !== "?" && e.key !== "Escape"){
    return;
  }
  switch(e.key){
    case "ArrowRight": case " ": case "PageDown":
      e.preventDefault(); nextSlide(); break;
    case "ArrowLeft": case "PageUp":
      e.preventDefault(); prevSlide(); break;
    case "Home":
      e.preventDefault(); goTo(0); break;
    case "End":
      e.preventDefault(); goTo(sections.length - 1); break;
    case "f": case "F":
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(()=>{});
      break;
    case "?":
      toggleHelp(); break;
    case "Escape":
      toggleHelp(false); break;
    default:
      if(e.key >= "1" && e.key <= "9"){
        const n = parseInt(e.key, 10) - 1;
        if(n < sections.length) goTo(n);
      }
  }
});

// deep-link support: open with #4 to start on slide 4
const hashN = parseInt(location.hash.replace("#",""), 10);
if(!isNaN(hashN) && hashN >= 1 && hashN <= sections.length){
  current = hashN - 1;
}
render();
</script>
</body>
</html>
